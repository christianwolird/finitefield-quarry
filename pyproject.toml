# Setuptools reads this section to create an installable Python package.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# Package metadata and the two external libraries used for prime generation
# and extension-field arithmetic.
name = "finitefield-quarry"
version = "0.1.0"
description = "Search for square patterns and strong perfect bricks over finite fields."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sympy",
    "galois",
]

[tool.setuptools]
# Source code lives below src/, so importing ffquarry does not depend on the
# repository root itself being on Python's module search path.
package-dir = {"" = "src"}
packages = ["ffquarry"]
